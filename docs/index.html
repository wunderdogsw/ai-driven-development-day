<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI-native development – Jakamo x Wunderdog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/nav.css">
<style>
/* The start page is always dark, on the Wunderdog light-streak gradient (assets/streaks.js). */
body { margin: 0; min-height: 100vh; background: #03060d; color: var(--fg); font-family: var(--sans); font-size: 16px; line-height: 1.55; display: flex; flex-direction: column; }
canvas.wd-streaks { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; display: block; }
.site-nav { --n-bg: rgba(3, 6, 13, .35); --n-line: rgba(139, 184, 240, .25); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.wrap { width: 100%; max-width: 1120px; margin: 0 auto; box-sizing: border-box; padding: 0 16px; }
.hero { flex: 1; display: flex; align-items: center; padding: 48px 0; color: var(--wd-offwhite); text-align: center; }
.hero .wrap { display: flex; flex-direction: column; align-items: center; }
.hero .kicker { font-family: var(--mono); font-size: 14px; letter-spacing: .04em; color: var(--wd-light-blue); }
h1 { margin: 0 0 16px; max-width: 16ch; font-size: clamp(40px, 7vw, 72px); line-height: 1.05; font-weight: 500; letter-spacing: -.01em; color: var(--wd-sand); }
.hero p { margin: 0; max-width: 56ch; font-size: 18px; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 28px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 999px; font-weight: 500; text-decoration: none; color: var(--wd-navy); background: var(--wd-sand); }
.btn.ghost { color: var(--wd-offwhite); background: transparent; border: 1.5px solid rgba(139, 184, 240, .55); }
.btn:focus-visible { outline: 2px solid var(--wd-light-blue); outline-offset: 3px; }
.day { list-style: none; margin: 0 0 72px; padding: 8px; display: grid; gap: 8px; background: rgba(8, 32, 61, .72); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(139, 184, 240, .3); border-radius: 20px; }
.day a, .day .row { display: grid; grid-template-columns: 72px 48px 1fr; align-items: center; gap: 12px; padding: 14px 18px; border-radius: 14px; text-decoration: none; color: var(--wd-offwhite); }
.day a:hover { background: rgba(139, 184, 240, .1); }
.day a:focus-visible { outline: 2px solid var(--wd-light-blue); outline-offset: -2px; }
.day .tm { font-family: var(--mono); font-size: 14px; color: var(--muted); }
.day .no { font-size: 20px; font-weight: 700; color: var(--wd-orange); }
.day b { display: block; font-size: 20px; font-weight: 500; }
.day small { display: block; font-size: 15px; color: var(--muted); }
.day .row { opacity: .6; }
@media (max-width: 560px) { .day a, .day .row { grid-template-columns: 56px 1fr; } .day .no { display: none; } }
footer { border-top: 1px solid rgba(139, 184, 240, .25); background: rgba(3, 6, 13, .35); }
footer .wrap { padding-top: 20px; padding-bottom: 32px; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>

    </ul>
  </div>
</nav>
